name: Test Examples
description: |
  Runs terraform init, terraform plan, and terraform apply, then terraform plan to check for idempotency.
  Allows setting the `AVM_EXAMPLE` environment variable to run a specific example. e.g. in matrix builds.
commands:
  - type: copycwdtotemp
    name: Copy to temp
    cwd: "."

    # This kicks off the tfenv installer
  - type: shell
    name: Terraform
    command_line: terraform -version
    cwd: "."

  - type: shell
    name: Clean Terraform
    command_line: |
      find . -type d -name '.terraform' -prune -exec rm -rf {} +
      find . -type f -name '.terraform.lock.hcl' -exec rm -f {} +
      find . -type f -name '*.tfstate*' -exec rm -f {} +

  - type: foreachdirectory
    name: for each example clean up if not matching AVM_EXAMPLE
    depth: 1
    include_hidden: false
    skip_on_not_exist: true
    working_directory: "./examples"
    env:
      TF_IN_AUTOMATION: "1"
    mode: parallel
    commands:
      - type: shell
        name: Check for and remove non-matching examples
        command_line: |
          if [ -z "$AVM_EXAMPLE" ]; then
            echo "AVM_EXAMPLE is not set. Continue."
            exit 0
          fi

          if [ -z "$AVM_RUNNING_IN_GITHUB_ACTIONS" ]; then
            echo "AVM_RUNNING_IN_GITHUB_ACTIONS is not set. Continue."
            exit 0
          fi

          if [ "$AVM_EXAMPLE" != "$ITEM" ]; then
            echo "AVM_EXAMPLE is set to '$AVM_EXAMPLE', but the current example is '$ITEM'." 1>&2
            echo "We are running in GitHub Actions, so we can safely remove this example." 1>&2
            rm -r -f $ITEM
            exit 0
          fi

  - type: foreachdirectory
    name: for each example
    depth: 1
    include_hidden: false
    skip_on_not_exist: true
    working_directory: "./examples"
    env:
      TF_IN_AUTOMATION: "1"
    mode: parallel
    working_directory_strategy: "item_relative"
    commands:
      - type: shell
        name: Check for Ignore File
        command_line: |
          if [ -e .e2eignore ]; then
            echo "Found the .e2eignore file, so skipping the example $ITEM" 1>&2
            exit 99
          fi
        skip_exit_codes: [99]

      - type: shell
        name: Check AVM_EXAMPLE
        command_line: |
          if [ -z "$AVM_EXAMPLE" ]; then
            echo "AVM_EXAMPLE is not set. Continue."
            exit 0
          fi

          if [ "$AVM_EXAMPLE" != "$ITEM" ]; then
            echo "AVM_EXAMPLE is set to '$AVM_EXAMPLE', but the current example is '$ITEM'." 1>&2
            echo "Therefore skipping this example." 1>&2
            exit 99
          fi
        skip_exit_codes: [99]

      - type: shell
        name: run pre.sh if exists
        command_line: |
          if [ -f pre.sh ]; then
            chmod +x pre.sh && \
            ./pre.sh
          fi

      - type: pwsh
        name: run pre.ps1 if exists
        script: |
          if (Test-Path pre.ps1) {
            & ./pre.ps1
          }

      - type: shell
        name: Terraform Init
        command_line: |
          set -a; [ -f .env ] && . ./.env; set +a
          terraform init

      - type: shell
        name: Terraform Plan
        command_line: |
          set -a; [ -f .env ] && . ./.env; set +a
          terraform plan -out tfplan

        # Exit 90 means "failed, but the error looks transient" and is what gates the
        # retry steps below. It is listed in success_exit_codes so that a failed early
        # attempt does not mark the whole example as failed when a later attempt passes.
        # The final attempt omits it, so exhausting the retries fails the run.
        #
        # All three attempts share one script. Setting AVM_E2E_RETRY=1 switches it from
        # "apply the saved plan" to "destroy, then redeploy from scratch".
      - type: shell
        name: Terraform Apply
        command_line: &apply_with_retry |
          set -a; [ -f .env ] && . ./.env; set +a

          # Matched case insensitively against the combined terraform output. Keep these
          # anchored to capacity and quota wording. Bare Azure codes such as
          # OperationNotAllowed are deliberately excluded, as they also cover genuine
          # failures that a retry would only mask.
          retryable='SkuNotAvailable|Capacity Restrictions|is currently not available in location|sku_selector found no deployable VM size|Allocation ?Failed|results in exceeding approved'

          log="$(mktemp)"
          rc_file="$(mktemp)"

          # Output is piped through tee rather than redirected, so it still streams while
          # terraform runs and porch's progress ticker keeps reporting. The exit code is
          # stashed in a file because "$?" after a pipeline belongs to tee, not terraform.
          run() {
            { "$@" 2>&1; echo "$?" > "$rc_file"; } | tee "$log"
            rc="$(cat "$rc_file" 2>/dev/null)"
            return "${rc:-1}"
          }

          if [ "${AVM_E2E_RETRY:-0}" = "1" ]; then
            # Destroy before retrying. Re-planning in place is not safe: example resource
            # names come from module.naming and do not depend on the region, so changing
            # region replaces the resource group under the same name while name-only
            # dependents such as subnets are planned as unchanged. Azure cascade-deletes
            # those with the resource group and the apply then fails with
            # "Root object was present, but now absent".
            #
            # Destroying also drops random_integer.region_index from state, so the next
            # plan re-rolls the region on its own. That is why no -replace is needed.
            if ! run terraform destroy -auto-approve; then
              echo "Retry aborted for $ITEM: terraform destroy failed, refusing to redeploy over partial state." 1>&2
              cat "$log" 1>&2
              rm -f "$log" "$rc_file"
              exit 1
            fi

            # No saved plan: a fresh apply re-plans against the now empty state and picks
            # a new region. Reusing tfplan here would fail with "Saved plan is stale".
            run terraform apply -auto-approve
          else
            run terraform apply -auto-approve tfplan
          fi
          rc=$?

          rm -f "$rc_file"

          if [ "$rc" -eq 0 ]; then
            rm -f "$log"
            exit 0
          fi

          # Porch only prints stderr for failed steps unless it is run with --stdout,
          # so re-emit the captured output there to keep failures diagnosable.
          cat "$log" 1>&2

          if grep -qEi "$retryable" "$log"; then
            echo "Example $ITEM hit a retryable capacity error." 1>&2
            rm -f "$log"
            exit 90
          fi

          rm -f "$log"
          exit 1
        success_exit_codes: [0, 90]

      - type: shell
        name: Terraform Destroy and Retry (1)
        command_line: *apply_with_retry
        env:
          AVM_E2E_RETRY: "1"
        runs_on_condition: exit-codes
        runs_on_exit_codes: [90]
        success_exit_codes: [0, 90]

      - type: shell
        name: Terraform Destroy and Retry (2, final)
        command_line: *apply_with_retry
        env:
          AVM_E2E_RETRY: "1"
        runs_on_condition: exit-codes
        runs_on_exit_codes: [90]

      - type: shell
        name: Terraform Plan Idempotency Check
        command_line: |
          set -a; [ -f .env ] && . ./.env; set +a
          terraform plan -detailed-exitcode -out tfplan

        # This command will run if the previous plan was not idempotent
        # and will output the plan to stderr.
      - type: shell
        name: Terraform Show Plan (if not idempotent)
        command_line: terraform show tfplan 1>&2
        runs_on_condition: exit-codes
        runs_on_exit_codes: [2]
        success_exit_codes: []

      - type: shell
        name: Terraform Destroy
        command_line: |
          if [ ! -d ".terraform" ]; then
            exit 0
          fi
          ls -al 1>&2
          set -a; [ -f .env ] && . ./.env; set +a
          terraform destroy -auto-approve
        runs_on_condition: always

      - type: shell
        name: run post.sh if exists
        command_line: |
          if [ -f post.sh ]; then
            chmod +x post.sh && \
            ./post.sh
          fi

      - type: pwsh
        name: run post.ps1 if exists
        script: |
          if (Test-Path post.ps1) {
            & ./post.ps1
          }

  - type: shell
    name: Clean up
    command_line: |
      workdir="$(pwd)"
      cd /
      case "$workdir" in
        /tmp/*|/var/tmp/*)
          rm -rf "$workdir"
          ;;
        *)
          echo "Refusing to remove non-temp directory: $workdir" 1>&2
          find "$workdir" -type d -name '.terraform' -prune -exec rm -rf {} + 2>/dev/null || true
          find "$workdir" -type f -name '.terraform.lock.hcl' -exec rm -f {} + 2>/dev/null || true
          find "$workdir" -type f -name '*.tfstate*' -exec rm -f {} + 2>/dev/null || true
          ;;
      esac
    runs_on_condition: always
